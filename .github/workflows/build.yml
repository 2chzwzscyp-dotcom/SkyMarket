name: SkyMarket JAR Olustur
on:
push:
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Proje Dosyalarini Olustur
run: |
mkdir -p src/main/java/com/swain/skymarket
mkdir -p src/main/resources
cat << 'EOF' > pom.xml
<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0"
xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
<modelVersion>4.0.0</modelVersion>
<groupId>com.swain.skymarket</groupId>
<artifactId>SkyMarket</artifactId>
<version>1.0.0</version>
<packaging>jar</packaging>
<properties>
<project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
<maven.compiler.release>21</maven.compiler.release>
</properties>
<repositories>
<repository>
<id>papermc-repo</id>
<url>https://repo.papermc.io/repository/maven-public/</url>
</repository>
<repository>
<id>jitpack.io</id>
<url>https://jitpack.io</url>
</repository>
</repositories>
<dependencies>
<dependency>
<groupId>io.papermc.paper</groupId>
<artifactId>paper-api</artifactId>
<version>1.21.4-R0.1-SNAPSHOT</version>
<scope>provided</scope>
</dependency>
<dependency>
<groupId>com.github.MilkBowl</groupId>
<artifactId>VaultAPI</artifactId>
<version>1.7.1</version>
<scope>provided</scope>
</dependency>
</dependencies>
<build>
<finalName>￼{project.version}</finalName>
<resources>
<resource>
<directory>src/main/resources</directory>
<filtering>true</filtering>
</resource>
</resources>
<plugins>
<plugin>
<groupId>org.apache.maven.plugins</groupId>
<artifactId>maven-compiler-plugin</artifactId>
<version>3.13.0</version>
<configuration>
<release>21</release>
<encoding>UTF-8</encoding>
</configuration>
</plugin>
</plugins>
</build>
</project>
EOF
cat << 'EOF' > src/main/resources/plugin.yml
name: SkyMarket
version: '${project.version}'
main: com.swain.skymarket.SkyMarketPlugin
api-version: '1.21'
softdepend: [Vault, floodgate, Geyser-Spigot]
commands:
market:
description: Skyblock market menusunu acar.
aliases: [m]
usage: /market [ara <kelime> | sepet]
EOF
cat << 'EOF' > src/main/resources/items.yml
custom-items:
cobblestone-gen-tier2:
material: COBBLESTONE
category: SPECIAL
name: "Kiriktas Jenerator Yukseltmesi (Seviye 2)"
price: 15.0
custom-model-data: 1002
lore:
- "Kiriktask jeneratoru icin ozel yukseltme parcasi"
EOF
cat << 'EOF' > src/main/java/com/swain/skymarket/SkyMarketPlugin.java
package com.swain.skymarket;
