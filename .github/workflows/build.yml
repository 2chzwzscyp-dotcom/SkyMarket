import java.util.*;
public final class SkyMarketPlugin extends JavaPlugin implements CommandExecutor, TabCompleter, Listener {
public enum MarketCategory {
FARMING("Tarim ve Hayvancilik", Material.SUGAR_CANE, "Ciftlik urunleri, mahsuller ve spawn yumurtalari"),
MINING("Maden ve Bloklar", Material.DIAMOND_ORE, "Madenler, kulceler, tas ve tum yapi bloklari"),
SPECIAL("Spawner ve Ozel Esyalar", Material.SPAWNER, "Spawner, huni, kiziltas ve jenerator esyalari"),
POTIONS_ENCHANTS("Iksir ve Buyu", Material.EXPERIENCE_BOTTLE, "XP siseleri, buyu kitaplari ve iksir malzemeleri");
final String displayName;
final Material icon;
final String description;
MarketCategory(String displayName, Material icon, String description) {
this.displayName = displayName;
this.icon = icon;
this.description = description;
}
static MarketCategory fromString(String input) {
if (input == null) return null;
for (MarketCategory c : values()) {
if (c.name().equalsIgnoreCase(input) || c.displayName.equalsIgnoreCase(input)) return c;
}
return null;
}
}
public record MarketItem(String id, Material material, MarketCategory category, String turkishName,
double unitPrice, Integer customModelData, List<String> extraLore) {
ItemStack createPurchasedStack(int amount) {
ItemStack stack = new ItemStack(material, Math.max(1, amount));
ItemMeta meta = stack.getItemMeta();
if (meta != null) {
if (customModelData != null) meta.setCustomModelData(customModelData);
if (extraLore != null && !extraLore.isEmpty()) meta.setLore(new ArrayList<>(extraLore));
stack.setItemMeta(meta);
}
return stack;
}
}
public static class CartEntry {
final String itemId;
int amount;
CartEntry(String itemId, int amount) { this.itemId = itemId; this.amount = Math.max(1, amount); }
void addAmount(int extra) { this.amount = Math.max(1, this.amount + extra); }
}
public enum MenuType { MAIN_CATEGORIES, CATEGORY_ITEMS, SEARCH_RESULTS, ITEM_ACTION, CART }
public static class MarketHolder implements InventoryHolder {
final MenuType type;
final MarketCategory category;
final MarketItem selectedItem;
final int selectedAmount;
final int page;
final String searchQuery;
Inventory inventory;
MarketHolder(MenuType type, MarketCategory category, MarketItem selectedItem, int selectedAmount, int page, String searchQuery) {
this.type = type;
this.category = category;
this.selectedItem = selectedItem;
this.selectedAmount = Math.max(1, selectedAmount);
this.page = Math.max(0, page);
this.searchQuery = searchQuery;
}
@Override public Inventory getInventory() { return inventory; }
}
public record PendingAmountSession(MarketItem item, MarketCategory returnCategory, String returnSearch, int returnPage) {}
private Economy vaultEconomy;
private final Map<UUID, Double> fallbackBalances = new HashMap<>();
private final Map<UUID, List<CartEntry>> cartsByUuid = new HashMap<>();
private final Map<String, MarketItem> itemsById = new LinkedHashMap<>();
private final Map<MarketCategory, List<MarketItem>> itemsByCategory = new EnumMap<>(MarketCategory.class);
private final List<MarketItem> allItems = new ArrayList<>();
private final Set<UUID> awaitingSearchInput = new HashSet<>();
private final Map<UUID, PendingAmountSession> awaitingAmountInput = new HashMap<>();
private static final Map<Material, String> TR_NAMES = new EnumMap<>(Material.class);
static {
